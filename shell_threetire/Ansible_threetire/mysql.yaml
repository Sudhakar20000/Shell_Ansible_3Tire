- name: install mysql-db
  hosts:  db
  become: yes
  tasks:
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: start and enable mysql
    service:
      name: mysqld
      state: started
      enabled: yes
  - name: setup root password
    command: mysql_secure_installation --set-root-pass RoboShop@1
  - name: install python dependencies
    pip:
      name: PyMySQL
      executable: pip3.9
  - name: grant remote access to root
    community.mysql.mysql_user:
      name: root
      host: "%"
      password: "ExpenseApp@1"
      priv: "*.*:ALL,GRANT"
      login_user: root
      login_password: "ExpenseApp@1"
      state: present
