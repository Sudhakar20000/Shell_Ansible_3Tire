- name: install mysql-db
  hosts:  db
  become: yes
  tasks:
  - name: remove mysql if already installed
  package:
    name: mysql-server
    state: absent
- name: remove mysql data directory
  file:
    path: /var/lib/mysql
    state: absent
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: start and enable mysql
    service:
      name: mysqld
      state: restarted
      enabled: yes
  - name: setup root password
    command: mysql_secure_installation --set-root-pass RoboShop@1
  
