- name: install mysql-db
  hosts:  db
  become: yes
  tasks:
  - name: install mysql
    package:
      name: mysql-server
      state: present
  - name: start and enable mysql
    service:
      name: mysqld
      state: started
      enabled: yes
  - name: setup root password
    command: mysql_secure_installation --set-root-pass RoboShop@1
